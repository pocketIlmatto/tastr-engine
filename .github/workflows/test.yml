name: tests
# Builds the engine natively and for WebAssembly, lints it, runs its unit tests, and checks that what crates.io
# would get builds on its own (docs/ci.md#the-tests-workflow). `test` is a required check on main.
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same PR supersedes the run in progress, so cancel it. Runs on main are never cancelled.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-nolto-${{ hashFiles('Cargo.lock') }}
      # Without LTO the crate compiles in about 20 s instead of 60 s, and the results are the same bits. Releases
      # keep the full [profile.release] from Cargo.toml.
      - name: Build, lint and test
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --locked
          cargo build --release --locked --lib --target wasm32-unknown-unknown
          cargo clippy --release --locked --all-targets -- -D warnings
          cargo test --release --locked --lib
          # What crates.io would get: the packaged files alone must build.
          cargo publish --dry-run --locked
