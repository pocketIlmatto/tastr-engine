# Monthly dependency updates, one grouped pull request per ecosystem (docs/ci.md#dependency-updates).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: monthly}
    groups:
      rust: {patterns: ["*"]}
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
    open-pull-requests-limit: 2
